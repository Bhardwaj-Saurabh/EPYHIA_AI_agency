[project]
name = "workers"
version = "0.1.0"
description = "EPYHIA Tier 2 - Orchestration Runtime + agents. No credentials; reaches the world only via the gate"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers"]
